<div class="mermaid-block">
	<div class="mermaid-toolbar" role="toolbar" aria-label="Diagram controls">
		<button type="button" class="mermaid-button" data-mermaid-action="zoom-out" aria-label="Zoom out" title="Zoom out">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
				<circle cx="11" cy="11" r="7"/>
				<path d="M21 21l-4.35-4.35"/>
				<path d="M8 11h6"/>
			</svg>
		</button>
		<button type="button" class="mermaid-button" data-mermaid-action="zoom-in" aria-label="Zoom in" title="Zoom in">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
				<circle cx="11" cy="11" r="7"/>
				<path d="M21 21l-4.35-4.35"/>
				<path d="M8 11h6M11 8v6"/>
			</svg>
		</button>
		<button type="button" class="mermaid-button" data-mermaid-action="reset" aria-label="Reset zoom" title="Reset zoom">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
				<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
				<path d="M3 3v5h5"/>
			</svg>
		</button>
		<button type="button" class="mermaid-button" data-mermaid-action="overlay" aria-label="Toggle page overlay" title="Toggle page overlay">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
				<path d="M8 3H5a2 2 0 0 0-2 2v3"/>
				<path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
				<path d="M3 16v3a2 2 0 0 0 2 2h3"/>
				<path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
			</svg>
		</button>
	</div>
	<div class="mermaid-stage">
		<div class="mermaid">
{{- .Inner | strings.TrimSpace -}}
		</div>
	</div>
</div>
